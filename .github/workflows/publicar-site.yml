# Publica o TreiNa como site no GitHub Pages a cada mudança na branch main.
# O site montado vai para a branch "gh-pages" (Settings > Pages > Deploy from a branch > gh-pages / root).
# Também dá para rodar na mão: aba Actions > "Publicar site" > Run workflow.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Dados do Supabase (arquivo .env, ou as Variables do repositório se existirem)
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CHAVE: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$CHAVE" ]; then
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$URL" "$CHAVE" > .env
            echo "Supabase: usando as Variables do repositório."
          elif grep -qi 'COLE' .env; then
            echo "::warning::Supabase não configurado no .env: o site vai funcionar, mas sem login e sem backup na nuvem."
          else
            echo "Supabase: usando os dados do arquivo .env."
          fi

      - name: Gerar o site
        env:
          EXPO_NO_TELEMETRY: 1
          NOME_REPO: ${{ github.event.repository.name }}
        run: |
          if [[ "$NOME_REPO" == *.github.io ]]; then export TREINA_BASE_URL=""; else export TREINA_BASE_URL="/$NOME_REPO"; fi
          npx expo export --platform web
          node scripts/pos_build_web.js

      - name: Enviar o site para a branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site gerado a partir de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
          echo "Site enviado para a branch gh-pages. Endereço: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${{ github.event.repository.name }}/"
